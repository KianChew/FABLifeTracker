<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Life Tracker — Table</title>
<style>
  :root{--bg:#0d0d12;--ink:#f2f0e9;--dim:#aaa5af;--brass:#e0b84b;--p1:#d64545;--p2:#3b6fa0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
  .app{height:100dvh;display:grid;grid-template-rows:1fr auto 1fr;gap:4px}.zone{display:grid;grid-template-columns:1fr 2fr 1fr;grid-template-rows:auto auto 1fr auto;align-items:center;padding:14px;touch-action:manipulation}.p1{background:radial-gradient(100% 100% at 50% 0,#4a1518,var(--bg) 75%)}.p2{background:radial-gradient(100% 100% at 50% 100%,#132d45,var(--bg) 75%)}
  .p1 .life{color:var(--p1)}.p2 .life{color:var(--p2)}.name{text-align:center;grid-column:1/-1;color:var(--dim);font-size:clamp(14px,3vw,24px);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.hero{text-align:center;grid-column:1/-1;color:var(--dim);font-size:clamp(11px,2vw,16px);margin-top:3px}.life{font:800 clamp(90px,22vw,220px)/1 ui-monospace,monospace;text-align:center;grid-column:2;grid-row:3;user-select:none}.life.bump{transform:scale(1.08)}.adjust{border:0;background:rgba(255,255,255,.08);color:var(--ink);border-radius:50%;width:clamp(54px,10vw,92px);height:clamp(54px,10vw,92px);font-size:clamp(28px,5vw,48px)}.minus{grid-column:1;grid-row:3}.plus{grid-column:3;grid-row:3}.hint{text-align:center;grid-column:1/-1;color:var(--dim);font-size:11px}.middle{display:flex;align-items:center;justify-content:center;background:#100f15;border-block:1px solid rgba(255,255,255,.1);padding:8px}.timer{font:700 clamp(30px,7vw,66px) ui-monospace,monospace;color:var(--brass);user-select:none}.paused{opacity:.55}
</style></head>
<body><div class="app">
  <section class="zone p1"><div class="name" id="name0">Player 1</div><div class="hero" id="hero0"></div><button class="adjust minus" data-player="0" data-delta="-1">−</button><div class="life" id="life0">20</div><button class="adjust plus" data-player="0" data-delta="1">+</button><div class="hint">Tap −/+ · hold to repeat</div></section>
  <div class="middle"><div class="timer" id="timer">30:00</div></div>
  <section class="zone p2"><div class="name" id="name1">Player 2</div><div class="hero" id="hero1"></div><button class="adjust minus" data-player="1" data-delta="-1">−</button><div class="life" id="life1">20</div><button class="adjust plus" data-player="1" data-delta="1">+</button><div class="hint">Tap −/+ · hold to repeat</div></section>
</div>
<script>
const proto=location.protocol==='https:'?'wss':'ws';let ws,state=null;const connect=()=>{ws=new WebSocket(`${proto}://${location.host}`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state')render(m.state)};ws.onclose=()=>setTimeout(connect,1500)};connect();
const send=m=>ws?.readyState===WebSocket.OPEN&&ws.send(JSON.stringify(m));const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function render(s){const prev=state;state=s;s.players.forEach((p,i)=>{document.getElementById('name'+i).textContent=p.name;document.getElementById('hero'+i).textContent=p.heroName||'';const el=document.getElementById('life'+i);if(prev&&prev.players[i].life!==p.life){el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),130)}el.textContent=p.life});const t=s.timer;document.getElementById('timer').textContent=fmt(t.mode==='countdown'?t.remainingMs:t.elapsedMs);document.getElementById('timer').classList.toggle('paused',!t.running)}
document.querySelectorAll('.adjust').forEach(btn=>{const player=Number(btn.dataset.player),delta=Number(btn.dataset.delta);let hold,repeat,didHold;const start=e=>{e.preventDefault();didHold=false;hold=setTimeout(()=>{didHold=true;send({type:'life:delta',player,delta:delta*5});repeat=setInterval(()=>send({type:'life:delta',player,delta:delta*5}),350)},600)};const end=e=>{e.preventDefault();clearTimeout(hold);clearInterval(repeat);if(!didHold)send({type:'life:delta',player,delta})};btn.addEventListener('pointerdown',start);btn.addEventListener('pointerup',end);btn.addEventListener('pointercancel',end);});
let lastTap=0;document.getElementById('timer').addEventListener('pointerup',()=>{const now=Date.now();if(now-lastTap<350&&state)send({type:state.timer.running?'timer:pause':'timer:start'});lastTap=now});
</script></body></html>
